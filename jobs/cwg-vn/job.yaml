# Job 2 – Page "CWG Markets & Partner" (https://www.facebook.com/CWG.Partner/)
# Tệp khách: người Việt muốn làm đại lý (IB) cho CWG Markets. Anh là đối tác IB chính thức.
# Ghi đè lên config.yaml. Chạy: JOB=cwg-vn python -m src.runner <việc> --dry-run --now

job:
  id: cwg-vn
  name: "CWG VN"                       # nhãn ở đầu mỗi tin Telegram

brand:
  name: "CWG MARKETS & PARTNER"
  handle: "facebook.com/CWG.Partner"
  logo: "assets/brands/cwg/logo.png"
  icon: "assets/brands/cwg/icon.png"

autopost:
  live: false                          # chỉ gửi bản xem trước về Telegram cho tới khi anh duyệt

design:
  style: block
  palette: do-cwg
  chart_theme: light

# Nội dung thương hiệu – AI CHỈ được dùng các dữ kiện trong `facts`, không tự bịa số liệu về sàn/hoa hồng.
brandpost:
  language: vi
  persona: >-
    Đội ngũ CWG Markets & Partner – đối tác IB chính thức của CWG Markets tại Việt Nam. Xưng "CWG Partner" hoặc
    "chúng tôi", gọi người đọc là "anh chị" hoặc "bạn". Giọng chuyên nghiệp, thực tế, gần gũi, không phô trương.
  audience: >-
    Người Việt đang hoặc muốn làm đại lý/IB forex-vàng: trader có cộng đồng, chủ group/kênh tài chính, người làm
    affiliate, nhân viên sales tài chính, đại lý đang làm cho sàn khác muốn tìm chính sách tốt hơn.
  commission_claim: "IB nhận 85% spread – ví dụ XAUUSD spread 5.x pip, IB nhận $50/lot"
  cta: "📩 Inbox Page để nhận chính sách chi tiết"
  # Dữ kiện anh xác nhận 02/10/2026 (ảnh + caption Page CWG Markets - IB Partner; giấy phép đối chiếu WikiFX).
  facts:
    - "Hoa hồng IB: 85% spread."
    - "Thưởng doanh số: tối thiểu 5%."
    - "Ví dụ: vàng XAUUSD spread 5.x pip thì IB nhận $50/lot."
    - "Rebate (hoa hồng) cộng ngay khi đóng lệnh, không giữ tiền của đối tác. (Viết đúng cụm 'Rebate cộng ngay khi đóng lệnh', không thêm chữ 'khách'.)"
    - "Không yêu cầu số khách hàng ban đầu; không yêu cầu doanh số tối thiểu."
    - "Đăng ký làm đối tác IB không mất phí."
    - "Có quản lý đối tác hỗ trợ tiếng Việt 1:1; có video đào tạo và bản tin phân tích mỗi ngày cho đối tác."
    - "Tập đoàn CWG Markets có giấy phép: FCA (Vương quốc Anh, FRN 785129), FSCA (Nam Phi, FSP 54031), VFSC (Vanuatu, số đăng ký 41694). Mỗi pháp nhân được cấp phép tại khu vực tương ứng."
    - "Điểm WikiFX của CWG Markets: 8.25/10."
  # Chữ ký cố định cuối MỌI caption (dấu ấn riêng của Page) – hệ thống tự thêm, AI không viết lại.
  signature: |-
    💼 CWG MARKETS TUYỂN ĐỐI TÁC IB
    💰 Chính sách hoa hồng cạnh tranh – lên tới 85% spread
    🎓 Video đào tạo và bản tin phân tích thị trường mỗi ngày
    🤝 Đội ngũ hỗ trợ tiếng Việt 1:1
    📩 Inbox Page ngay để nhận chính sách chi tiết
  # Thẻ chính sách cuối album (anh duyệt 02/10/2026)
  policy_card:
    spread: "85%"
    bonus: "5%"
    example: ["XAUUSD spread 5.x pip", "$50/lot"]
    terms:
      - [person, "Điều kiện để bắt đầu?", "Nhắn tin ngay cho chúng tôi để thay đổi mức hoa hồng của bạn."]
      - [clock, "Hoa hồng trả khi nào?", "Rebate (hoa hồng) cộng ngay khi đóng lệnh"]
      - [bars, "Có yêu cầu doanh số tối thiểu?", "Không yêu cầu doanh số"]
    licenses: [[FCA, "Anh", "FRN 785129"], [FSCA, "Nam Phi", "FSP 54031"], [VFSC, "Vanuatu", "Số ĐK 41694"]]
    score: "8.25"
    button: "Nhắn tin nhận chính sách"
  # Cách viết học từ caption anh làm tay: mở bằng câu hỏi chạm đúng băn khoăn của IB, đưa tiêu chí so sánh đánh số,
  # mỗi tiêu chí gắn 1 dữ kiện cụ thể, kết bằng lời mời nhẹ ("chỉ cần 15 phút trao đổi để tự so sánh").
  style_examples:
    - "Đang làm IB, bạn có biết mình nhận được bao nhiêu % spread không?"
    - "Trước khi quyết định đưa khách về sàn nào, bạn nên so sánh 4 điều sau: tỷ lệ chia hoa hồng, thời điểm trả tiền, điều kiện ràng buộc, pháp lý."
    - "Nếu bạn đang có tệp khách, chỉ cần 15 phút trao đổi để tự so sánh với chính sách hiện tại của mình."
  rules:
    - "Chỉ dùng số liệu có trong facts (85% spread, thưởng tối thiểu 5%, $50/lot ví dụ XAUUSD, giấy phép, WikiFX 8.25). Không tự thêm bảng tầng, điều kiện hay con số khác."
    - "Khi nói giấy phép luôn nói 'tập đoàn CWG Markets' và giữ ý 'mỗi pháp nhân được cấp phép tại khu vực tương ứng'."
    - "Không hứa thu nhập, không 'làm giàu nhanh', không ví dụ thu nhập tháng; nói về cách xây hệ thống bền vững."
    - "Không so sánh hạ thấp sàn khác bằng tên; không nói sai về giấy phép (chỉ dùng facts)."
    - "Không khuyến khích khách vay tiền, dùng đòn bẩy quá mức; luôn nhắc quản lý rủi ro cho khách của đại lý."
    - "Không dùng markdown, không in đậm; dùng emoji vừa phải làm đầu mục."
  disclaimer: >-
    ⚠️ Giao dịch CFD/Forex có rủi ro cao, bạn có thể mất toàn bộ vốn. Nội dung giới thiệu chương trình đối tác,
    không phải lời khuyên đầu tư.
  pillars:
    hoc-nghe-ib:
      name: "Học nghề IB"
      brief: "Series kiến thức nghề đại lý: IB là gì, mô hình hoa hồng (rebate/CPA/rev-share nói chung), xây cộng đồng, chăm khách, marketing, tuân thủ"
    ve-cwg:
      name: "Về CWG Markets"
      brief: "Giới thiệu CWG Markets và chương trình đối tác – CHỈ dựa trên facts; gợi ý inbox để biết chi tiết sản phẩm/điều kiện"
    bo-cong-cu:
      name: "Bộ công cụ đại lý"
      brief: "Mẫu nội dung đại lý chia sẻ cho khách, kịch bản tư vấn, trả lời câu hỏi khách hay hỏi, checklist chăm khách"
    goc-nhin-dai-ly:
      name: "Góc nhìn đại lý"
      brief: "Tình huống thực tế khi làm IB (ẩn danh, không số thu nhập): khó khăn thường gặp và cách xử lý, sai lầm của đại lý mới"
  order: [hoc-nghe-ib, bo-cong-cu, hoc-nghe-ib, ve-cwg, hoc-nghe-ib, goc-nhin-dai-ly]

