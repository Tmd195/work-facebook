# Job 4 – Page "DecodeFx Trading" (https://www.facebook.com/DecodeFx.Trading)
# Tiếng Việt, hỗ trợ nhà đầu tư – "cho đi nhiều hơn". Anh chốt 07–08/10/2026.
# ĐỢT 1 (bật 08/10/2026): bản tin 06:00, 2 Reels (12:00, 20:00), album kiến thức 15:00, tin nóng ≤ 2/ngày.
# ĐỢT 2 (chưa làm): 4 video plan 07:00–07:45, cập nhật plan trong comment, tổng kết 23:00, tổng kết tuần / lịch tuần.

job:
  id: decode-trading
  name: "DecodeFx Trading"             # nhãn ở đầu mỗi tin Telegram

brand:
  name: "DECODEFX TRADING"
  page_name: "DecodeFx Trading"
  word: "DECODE"
  lockup: ["FX", "TRADING"]
  handle: "facebook.com/DecodeFx.Trading"
  logo: "assets/brands/decode/logo.png"
  icon: "assets/brands/decode/icon.png"

autopost:
  live: true                           # anh cho đăng thật từ 08/10/2026

design:
  titles_upper: true
  style: block
  palette: decode
  theme: decode
  chart_theme: light

brandpost:
  language: vi
  persona: >-
    DecodeFx Trading – kênh chia sẻ hệ thống giao dịch thực chiến cho nhà đầu tư Việt Nam. Xưng "DecodeFx Trading" hoặc
    "chúng tôi", gọi người đọc là "bạn". Giọng gần gũi, thực chiến, cho đi nhiều hơn.
  audience: >-
    Nhà đầu tư cá nhân forex – vàng muốn có hệ thống giao dịch rõ ràng, áp dụng được ngay.
  signature: |-
    📈 DECODEFX TRADING – Con đường ngắn nhất để trở thành 1 Protrader
    🎯 Mỗi ngày 1 hệ thống giao dịch chọn lọc trên lệnh thật
  rules:
    - "Không hứa lợi nhuận, không 'chắc thắng', không 'làm giàu nhanh'. Không 18+."
    - "Không nói xấu sàn giao dịch (Page mang thương hiệu sàn DecodeFx)."
  disclaimer: >-
    ⚠️ Giao dịch CFD/Forex có rủi ro cao, bạn có thể mất toàn bộ vốn. Nội dung mang tính giáo dục, không phải lời
    khuyên đầu tư.

hashtags:
  brand: ["#DecodeFX", "#DecodeFxTrading"]

# Lịch đăng (giờ VN) – anh chốt 08/10/2026
schedule:
  td_bulletin:  { time: "06:00", days: [mon, tue, wed, thu, fri] }   # Bản tin sáng – form "Tạp chí kinh doanh" (mẫu 12)
  reel_smc:     { time: "12:00" }                                    # Reels kiến thức hệ thống – mỗi ngày 1 hệ thống
  td_album:     { time: "15:00", days: [mon, tue, wed, thu, fri] }   # Album kiến thức – form "Sổ tay Trader"
  td_album_wk1: { time: "10:00", days: [sat, sun] }                  # cuối tuần không có plan → 2 album
  td_album_wk2: { time: "16:00", days: [sat, sun] }
  reel_indi:    { time: "20:00" }                                    # Reels indicator Sniper AI V4/V7

# Tin nóng (bộ săn tin fxtin) – tối đa 2 tin/ngày, chỉ tin lớn, khuôn mẫu 12 nhãn "TIN NÓNG"
hunter:
  enabled: true
  style: editorial
  interval: 150           # thưa hơn các Page khác để không dồn truy vấn vào fxtin
  batch_minutes: 5
  min_gap_minutes: 60
  max_per_day: 2
  weekend_max_per_day: 0
  weekend_min_score: 9
