hashtags:
  brand: ["#CWGMarkets", "#CWGGlobal"]

# Lịch đăng (giờ UTC – anh chốt 03/10/2026). Giờ VN = UTC + 7.
# Ngày thường: bản tin ngày mới → 4 bài xu hướng riêng (chiều giờ VN, cách 15') → vĩ mô sau 2 tiếng.
schedule:
  cwg_morning: { time: "06:00", days: [mon, tue, wed, thu, fri] }   # 13:00 VN – bản tin ngày mới (trước phiên London)
  cwg_fx_dxy:  { time: "06:30", days: [mon, tue, wed, thu, fri] }   # 13:30 VN – DXY & tác động lên vàng (cố định)
  cwg_fx_oil:  { time: "06:45", days: [mon, tue, wed, thu, fri] }   # 13:45 VN – dầu (cố định)
  # 6 ô cho EUR/GBP/CAD/AUD/JPY/CHF: có tin đỏ → đủ các đồng có tin đỏ; không có → tối thiểu 2 đồng tin vàng.
  # Ô không có đồng nào hôm đó tự bỏ qua.
  cwg_fx_1:    { time: "07:00", days: [mon, tue, wed, thu, fri] }   # 14:00 VN
  cwg_fx_2:    { time: "07:15", days: [mon, tue, wed, thu, fri] }   # 14:15 VN
  cwg_fx_3:    { time: "07:30", days: [mon, tue, wed, thu, fri] }   # 14:30 VN
  cwg_fx_4:    { time: "07:45", days: [mon, tue, wed, thu, fri] }   # 14:45 VN
  cwg_fx_5:    { time: "08:00", days: [mon, tue, wed, thu, fri] }   # 15:00 VN
  cwg_fx_6:    { time: "08:15", days: [mon, tue, wed, thu, fri] }   # 15:15 VN
  cwg_macro:   { time: "09:15", after_fx: 120, days: [mon, tue, wed, thu, fri] }   # 2 tiếng sau bài đồng tiền cuối cùng
  cwg_license: { time: "05:30", dates: [] }                         # điền 3 ngày khi bật đăng thật (FCA → FSCA → VFSC)
  # Cuối tuần: giữ như Page VN, giờ UTC
  cwg_wk_recap: { time: "09:00", days: [sat] }   # 16:00 VN
  cwg_wk_top5:  { time: "14:00", days: [sat] }   # 21:00 VN
  cwg_wk_tech:  { time: "20:00", days: [sat] }   # 03:00 VN chủ nhật
  cwg_wk_cot:   { time: "10:00", days: [sun] }   # 17:00 VN
  cwg_wk_macro: { time: "15:00", days: [sun] }   # 22:00 VN
  cwg_wk_ahead: { time: "20:00", days: [sun] }   # 03:00 VN thứ 2
  # Reels thị trường theo khuôn mẫu anh gửi 03/10/2026 (giọng nhân bản tiếng Anh)
  reel:         { time: "12:00", days: [mon, tue, wed, thu, fri, sat, sun] }   # 19:00 VN

hunter:
  enabled: true
  interval: 90            # chậm hơn bản VN để 2 Page không cùng dồn truy vấn vào fxtin
  batch_minutes: 5
  min_gap_minutes: 30
  max_per_day: 1          # Page Global: tối đa 1 bài tin nóng/ngày (anh chốt 03/10/2026)
  weekend_max_per_day: 1
  weekend_min_score: 8

reels:
  style: market                        # khuôn Reels thị trường (src/reels/mkt) – khác Page VN
  voice: clone_en                      # giọng anh gửi: assets/private/voice_ref_cwg_global.mp3 (gói mã hoá)
