# Báo cáo đánh giá tuần - Chủ nhật 23:00 giờ VN (16:00 UTC), gửi riêng qua Telegram.
name: Weekly report

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: followup
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cài thư viện
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code
      - name: Tạo & gửi báo cáo
        run: python -m src.report
      - name: Lưu số liệu tuần
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add state/metrics.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Lưu số liệu báo cáo tuần"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
      - name: Báo lỗi hệ thống
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="❌ Lỗi hệ thống khi tạo báo cáo tuần. Xem: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} 🖥 Bật Máy để sửa đổi"
